name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build Nameless-Java-API
        run: |
          git clone https://github.com/NamelessMC/Nameless-Java-API.git
          cd Nameless-Java-API
          mvn -q install -DskipTests
      - name: Build with Maven
        run: mvn -B package -DskipTests
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Nameless-Link-Improved
          path: target/Nameless-Link-Improved.jar
